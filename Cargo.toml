[workspace]
members = [
    "crates/sakuya_wire",
    "crates/sakuya_packet_protection",
    "crates/sakuya_link",
    "crates/sakuya_datagram_routing",
    "crates/sakuya_stream",
    "crates/sakuya_tls",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
bytes = "1.12.1"
dashmap = "6.1.0"
either = { version = "1.17.0", default-features = false }
nitori_call = { git = "https://github.com/opengensokyonet/nitori", rev = "bcd0708b98981c389ea6200f094c37cdfb56613a" }
nitori_crypto = { git = "https://github.com/opengensokyonet/nitori", rev = "bcd0708b98981c389ea6200f094c37cdfb56613a" }
nitori_crypto_aws_lc = { git = "https://github.com/opengensokyonet/nitori", rev = "bcd0708b98981c389ea6200f094c37cdfb56613a" }
nitori_id = { git = "https://github.com/opengensokyonet/nitori", rev = "bcd0708b98981c389ea6200f094c37cdfb56613a" }
nitori_io = { git = "https://github.com/opengensokyonet/nitori", rev = "bcd0708b98981c389ea6200f094c37cdfb56613a" }
proptest = "1.12.0"
ring = { version = "0.17.14", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["std", "aws_lc_rs"] }
rustls-pki-types = { version = "1.15.1", default-features = false, features = ["std"] }
rustls-webpki = { version = "0.103.16", default-features = false, features = ["std"] }
sakuya_wire = { path = "crates/sakuya_wire" }
sakuya_packet_protection = { path = "crates/sakuya_packet_protection", default-features = false }
sakuya_link = { path = "crates/sakuya_link" }
sakuya_datagram_routing = { path = "crates/sakuya_datagram_routing" }
sakuya_stream = { path = "crates/sakuya_stream" }
sakuya_tls = { path = "crates/sakuya_tls" }
smallvec = "1.15.2"
snafu = { version = "0.9.2", git = "https://github.com/opengensokyonet/snafu", rev = "03cb8d2e52a3b0b33a39cc3d4ce8a7075fa4ab58" }
subtle = { version = "2.6.1", default-features = false }
time = { version = "0.3.55", default-features = false }
tokio = { version = "1", default-features = false }
