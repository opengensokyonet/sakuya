[workspace]
members = [
    "crates/sakuya_var_int",
    "crates/sakuya_wire",
    "crates/sakuya_wire_v1",
    "crates/sakuya_wire_datagram",
    "crates/sakuya_wire_reset_stream_at",
    "crates/sakuya_packet_protection_v1",
    "crates/sakuya_packet_protection_ring",
    "crates/sakuya_packet_protection_aws_lc",
    "crates/sakuya_clock",
    "crates/sakuya_clock_tokio",
    "crates/sakuya_link",
    "crates/sakuya_datagram_routing_v1",
    "crates/sakuya_stream_v1",
    "crates/sakuya_stream_receive_buffer_fragmented",
    "crates/sakuya_stream_sets",
    "crates/sakuya_stream_reset_stream_at",
    "crates/sakuya_recovery_v1",
    "crates/sakuya_connection",
    "crates/sakuya_connection_datagram",
    "crates/sakuya_connection_reset_stream_at",
    "crates/sakuya_qlog_v1",
    "crates/sakuya_qlog_datagram",
    "crates/sakuya_qlog_reset_stream_at",
    "crates/sakuya_endpoint_v1",
    "crates/sakuya_udp_tokio",
    "crates/sakuya_sync_std",
    "crates/sakuya_test_support",
    "crates/sakuya_interop",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys"] }
bytes = "1.12.1"
dashmap = "6.1.0"
either = { version = "1.17.0", default-features = false }
frunk_core = { version = "=0.5.0", default-features = false }
futures-util = { version = "0.3.32", default-features = false, features = ["alloc"] }
hashbrown = { version = "0.17.1", default-features = false }
kasen_handshake = { git = "https://github.com/opengensokyonet/kasen", rev = "5d0649bc3aa2cd04453be29d2424c562c8e19ed4", default-features = false }
nitori_call = { git = "https://github.com/opengensokyonet/nitori", rev = "cad7dadafe0af6c6265ea684d2549fbb78b55aca", default-features = false }
nitori_crypto = { git = "https://github.com/opengensokyonet/nitori", rev = "cad7dadafe0af6c6265ea684d2549fbb78b55aca" }
nitori_crypto_aws_lc = { git = "https://github.com/opengensokyonet/nitori", rev = "cad7dadafe0af6c6265ea684d2549fbb78b55aca" }
nitori_id = { git = "https://github.com/opengensokyonet/nitori", rev = "cad7dadafe0af6c6265ea684d2549fbb78b55aca" }
nitori_io = { git = "https://github.com/opengensokyonet/nitori", rev = "cad7dadafe0af6c6265ea684d2549fbb78b55aca", default-features = false }
nitori_sync = { git = "https://github.com/opengensokyonet/nitori", rev = "cad7dadafe0af6c6265ea684d2549fbb78b55aca", default-features = false }
nix = { version = "0.31.3", default-features = false, features = ["net", "socket", "uio"] }
proptest = "1.12.0"
ring = { version = "0.17.14", default-features = false }
rustix = { version = "1.1.6", default-features = false, features = ["net", "std"] }
rustls-pki-types = { version = "1.15.1", default-features = false, features = ["std"] }
rustls-webpki = { version = "0.103.16", default-features = false, features = ["std"] }
sakuya_var_int = { path = "crates/sakuya_var_int" }
sakuya_wire = { path = "crates/sakuya_wire" }
sakuya_wire_v1 = { path = "crates/sakuya_wire_v1" }
sakuya_wire_datagram = { path = "crates/sakuya_wire_datagram" }
sakuya_wire_reset_stream_at = { path = "crates/sakuya_wire_reset_stream_at" }
sakuya_packet_protection_v1 = { path = "crates/sakuya_packet_protection_v1" }
sakuya_packet_protection_ring = { path = "crates/sakuya_packet_protection_ring" }
sakuya_packet_protection_aws_lc = { path = "crates/sakuya_packet_protection_aws_lc" }
sakuya_clock = { path = "crates/sakuya_clock" }
sakuya_clock_tokio = { path = "crates/sakuya_clock_tokio" }
sakuya_link = { path = "crates/sakuya_link" }
sakuya_datagram_routing_v1 = { path = "crates/sakuya_datagram_routing_v1" }
sakuya_stream_v1 = { path = "crates/sakuya_stream_v1" }
sakuya_stream_receive_buffer_fragmented = { path = "crates/sakuya_stream_receive_buffer_fragmented" }
sakuya_stream_sets = { path = "crates/sakuya_stream_sets" }
sakuya_stream_reset_stream_at = { path = "crates/sakuya_stream_reset_stream_at" }
sakuya_recovery_v1 = { path = "crates/sakuya_recovery_v1" }
sakuya_connection = { path = "crates/sakuya_connection" }
sakuya_connection_datagram = { path = "crates/sakuya_connection_datagram" }
sakuya_connection_reset_stream_at = { path = "crates/sakuya_connection_reset_stream_at" }
sakuya_qlog_v1 = { path = "crates/sakuya_qlog_v1" }
sakuya_qlog_datagram = { path = "crates/sakuya_qlog_datagram" }
sakuya_qlog_reset_stream_at = { path = "crates/sakuya_qlog_reset_stream_at" }
sakuya_udp_tokio = { path = "crates/sakuya_udp_tokio" }
sakuya_sync_std = { path = "crates/sakuya_sync_std" }
smallvec = "1.15.2"
snafu = { version = "0.9.2", git = "https://github.com/opengensokyonet/snafu", rev = "03cb8d2e52a3b0b33a39cc3d4ce8a7075fa4ab58" }
subtle = { version = "2.6.1", default-features = false }
time = { version = "0.3.55", default-features = false }
tokio = { version = "1", default-features = false }

# The type names of a composition's calls are long: line tables only keep
# the debug information of the connection's tests, with every feature on,
# well under the 4 GiB that 32-bit DWARF offsets reach.
[profile.dev.package.sakuya_connection]
debug = "line-tables-only"

[profile.dev.package.sakuya_endpoint_v1]
debug = "line-tables-only"

[profile.dev.package.sakuya_test_support]
debug = "line-tables-only"

[profile.dev.package.sakuya_interop]
debug = "line-tables-only"
