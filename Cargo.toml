[workspace]
members = [
    "crates/sakuya_wire",
    "crates/sakuya_protection",
    "crates/sakuya_datagram_routing",
    "crates/sakuya_stream",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
bytes = "1.12.1"
nitori_call = { git = "https://github.com/opengensokyonet/nitori", rev = "0255af55bbb58ebe7c0c0545b72faa44b193a72f" }
nitori_io = { git = "https://github.com/opengensokyonet/nitori", rev = "0255af55bbb58ebe7c0c0545b72faa44b193a72f" }
ring = { version = "0.17.14", default-features = false }
sakuya_wire = { path = "crates/sakuya_wire" }
sakuya_protection = { path = "crates/sakuya_protection" }
sakuya_datagram_routing = { path = "crates/sakuya_datagram_routing" }
sakuya_stream = { path = "crates/sakuya_stream" }
snafu = { version = "0.9.2", git = "https://github.com/opengensokyonet/snafu", rev = "03cb8d2e52a3b0b33a39cc3d4ce8a7075fa4ab58" }
tokio = { version = "1", default-features = false }
