[package]
name = "sakuya_endpoint_v1"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "QUIC endpoints for sakuya: address validation tokens, Retry and version negotiation responses"

[features]
# What only tests use: replacing the destination connection ID of a
# client's first Initial.
test-util = []
# An experiment for the proof of concept of passthrough forwarding: an
# incoming connection may be given the connection ID generator it is made
# with.
passthrough_experiment = []

[dependencies]
bytes.workspace = true
frunk_core.workspace = true
futures-util.workspace = true
hashbrown.workspace = true
nitori_call.workspace = true
nitori_crypto.workspace = true
nitori_io.workspace = true
nitori_sync.workspace = true
nitori_tls.workspace = true
sakuya_clock.workspace = true
sakuya_connection.workspace = true
sakuya_datagram_routing_v1.workspace = true
sakuya_link.workspace = true
sakuya_packet_protection_v1.workspace = true
sakuya_recovery_v1.workspace = true
sakuya_stream_v1.workspace = true
sakuya_wire.workspace = true
sakuya_wire_v1.workspace = true
snafu.workspace = true
time.workspace = true

[dev-dependencies]
nitori_crypto_aws_lc.workspace = true
nitori_sync = { workspace = true, features = ["std"] }
nitori_tls = { workspace = true, features = ["std"] }
sakuya_clock_tokio.workspace = true
sakuya_packet_protection_ring.workspace = true
sakuya_sync_std.workspace = true
sakuya_udp_tokio.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt", "sync", "time"] }

[[test]]
name = "forwarding"
required-features = ["passthrough_experiment"]
