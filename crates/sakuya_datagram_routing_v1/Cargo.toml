[package]
name = "sakuya_datagram_routing_v1"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Datagram routing and claim delivery for sakuya"

[dependencies]
hashbrown.workspace = true
nitori_id.workspace = true
sakuya_link.workspace = true
sakuya_var_int.workspace = true
sakuya_wire.workspace = true
sakuya_wire_v1.workspace = true
smallvec.workspace = true
snafu.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["sync"] }

# Only the claim-loom verification workspace builds with `--cfg sakuya_loom`;
# the claim core then takes its reference count and atomics from loom.
[target.'cfg(sakuya_loom)'.dependencies]
loom = { version = "0.7.3", features = ["futures"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(sakuya_loom)'] }
