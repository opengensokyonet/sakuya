[package]
name = "sakuya_stream"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Stream send and receive components for sakuya"

[dependencies]
bytes.workspace = true
# Transition: the stream components use RESET_STREAM_AT and its
# `ReliableSizeError`, so this enables the `reset_stream_at` extension of
# sakuya_wire until the components are split by extension; remove it then.
sakuya_wire = { workspace = true, features = ["reset_stream_at"] }
snafu.workspace = true

[dev-dependencies]
proptest.workspace = true
