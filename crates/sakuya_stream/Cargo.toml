[package]
name = "sakuya_stream"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Stream send and receive components for sakuya"

[features]
# The reliable stream reset extension (RESET_STREAM_AT) of the receive
# direction: the `reset_stream_at` module.
reset_stream_at = ["sakuya_wire/reset_stream_at"]

[dependencies]
bytes.workspace = true
# Transition: the send direction still uses RESET_STREAM_AT and its
# `ReliableSizeError` unconditionally, so this enables the `reset_stream_at`
# extension of sakuya_wire whatever the features of this crate. The receive
# direction is split: without the `reset_stream_at` feature it uses nothing of
# the extension. Remove the feature here once the send direction is split too.
sakuya_wire = { workspace = true, features = ["reset_stream_at"] }
snafu.workspace = true

[dev-dependencies]
proptest.workspace = true
