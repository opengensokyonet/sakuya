[package]
name = "sakuya_var_int"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "QUIC variable-length integers (RFC 9000 §16), read and written in memory and on nitori sources and sinks"

# `bytes` and `snafu` are declared here rather than inherited: the workspace
# turns on their standard library features, and the HTTP packages of iku
# depend on this package without the standard library.
[dependencies]
bytes = { version = "1.12.1", default-features = false }
nitori_call.workspace = true
nitori_codec.workspace = true
nitori_io.workspace = true
snafu = { version = "0.9.2", git = "https://github.com/opengensokyonet/snafu", rev = "03cb8d2e52a3b0b33a39cc3d4ce8a7075fa4ab58", default-features = false, features = ["rust_1_81"] }

[dev-dependencies]
nitori_codec = { workspace = true, features = ["std"] }
nitori_io = { workspace = true, features = ["std"] }
