[package]
name = "sakuya_stream_sets"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Stream sender and receiver, and the resets of RFC 9000, for sakuya"

[features]
# The reliable stream reset extension (RESET_STREAM_AT) for the stream sender
# and the stream receiver.
reset_stream_at = ["dep:sakuya_stream_reset_stream_at", "dep:sakuya_wire_reset_stream_at"]

[dependencies]
bytes.workspace = true
sakuya_stream_reset_stream_at = { workspace = true, optional = true }
sakuya_stream_v1.workspace = true
sakuya_wire.workspace = true
sakuya_wire_reset_stream_at = { workspace = true, optional = true }
sakuya_wire_v1.workspace = true
snafu.workspace = true

[dev-dependencies]
proptest.workspace = true
sakuya_stream_receive_buffer_fragmented.workspace = true
sakuya_stream_v1 = { workspace = true, features = ["test-util"] }

[[test]]
name = "reset_stream_at_send_model"
required-features = ["reset_stream_at"]

[[test]]
name = "reset_stream_at_receive_model"
required-features = ["reset_stream_at"]
