sakuya_datagram_routing.workspace = true
sakuya_link.workspace = true
sakuya_packet_protection.workspace = true
sakuya_recovery.workspace = true
sakuya_stream.workspace = true
sakuya_tls.workspace = true
sakuya_wire.workspace = true
snafu.workspace = true

[dev-dependencies]
nitori_crypto.workspace = true
nitori_crypto_aws_lc.workspace = true
sakuya_link.workspace = true
sakuya_recovery.workspace = true
sakuya_packet_protection = { workspace = true, features = ["ring"] }
time.workspace = true
