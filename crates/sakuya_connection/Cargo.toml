[package]
name = "sakuya_connection"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "QUIC connections for sakuya: the tree of a connection's state and the driver of its calls"

[features]
# Functions that check a destination connection ID strategy against the
# protocol's contract: the `connection_id::strategy_checks` module.
connection_id_strategy_checks = []
# What only tests use: making stream credentials, publishers, lineages and
# open packets of their own, packet writers of their own, reading what a
# publisher was given, and what the tests of settling on resumption share.
test-util = []

[dependencies]
bytes.workspace = true
frunk_core.workspace = true
futures-util.workspace = true
nitori_call.workspace = true
nitori_crypto.workspace = true
nitori_io.workspace = true
kasen_handshake.workspace = true
sakuya_clock.workspace = true
sakuya_datagram_routing_v1.workspace = true
sakuya_link.workspace = true
sakuya_packet_protection_v1.workspace = true
sakuya_recovery_v1.workspace = true
sakuya_stream_receive_buffer_fragmented.workspace = true
sakuya_stream_sets.workspace = true
sakuya_stream_v1.workspace = true
sakuya_var_int.workspace = true
sakuya_wire.workspace = true
sakuya_wire_v1.workspace = true
smallvec.workspace = true
snafu.workspace = true

[dev-dependencies]
nitori_call = { workspace = true, features = ["std"] }
nitori_crypto_aws_lc.workspace = true
nitori_sync = { workspace = true, features = ["std"] }
sakuya_link.workspace = true
sakuya_recovery_v1.workspace = true
sakuya_packet_protection_ring.workspace = true
sakuya_test_support = { path = "../sakuya_test_support" }
time.workspace = true
