[package]
name = "sakuya_connection"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "QUIC connections for sakuya: the tree of a connection's state and the driver of its calls"

[features]
# Functions that check a destination connection ID strategy against the
# protocol's contract: the `connection_id::strategy_checks` module.
connection_id_strategy_checks = []
# The DATAGRAM extension (RFC 9221) as a part: the `datagram` module.
datagram = ["sakuya_wire/datagram"]
# The reliable stream reset extension (RESET_STREAM_AT) as a part: the
# `reset_stream_at` module.
reset_stream_at = ["sakuya_wire/reset_stream_at", "sakuya_stream/reset_stream_at"]

[dependencies]
bytes.workspace = true
frunk_core.workspace = true
futures-util.workspace = true
nitori_call.workspace = true
nitori_crypto.workspace = true
nitori_io.workspace = true
nitori_tls.workspace = true
sakuya_clock.workspace = true
sakuya_datagram_routing.workspace = true
sakuya_link.workspace = true
sakuya_packet_protection.workspace = true
sakuya_recovery.workspace = true
sakuya_stream.workspace = true
sakuya_wire.workspace = true
smallvec.workspace = true
snafu.workspace = true
time.workspace = true

[dev-dependencies]
nitori_crypto_aws_lc.workspace = true
sakuya_link.workspace = true
sakuya_recovery.workspace = true
sakuya_packet_protection = { workspace = true, features = ["ring"] }
